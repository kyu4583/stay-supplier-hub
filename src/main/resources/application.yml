spring:
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/stay-supplier-hub
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

stay:
  search:
    max-nights: 30
    max-check-in-days-ahead: 180
    max-guests: 36
    budget: 3s
  mapping:
    sync-on-startup: true
    sync-interval: 6h
    shrink-reject-ratio: 0.30
  supplier:
    a:
      base-url: http://localhost:9090
      api-key: demo-a-key
      max-codes-per-call: 50
      response-timeout: 2s
      connect-timeout: 1s
      pending-acquire-timeout: 500ms
      max-connections: 2500
      max-concurrent-calls: 8
    b:
      base-url: http://localhost:9091
      api-key: demo-b-key
      max-codes-per-call: 50
      response-timeout: 2s
      connect-timeout: 1s
      pending-acquire-timeout: 500ms
      max-connections: 2500
      max-concurrent-calls: 8
